<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Floating Document/Reader Card with Shadow -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Document Header Dots / Globe Minimal Icon -->
  <circle cx="140" cy="148" r="8" fill="#cbd5e1" />
  <circle cx="166" cy="148" r="8" fill="#cbd5e1" />
  <circle cx="192" cy="148" r="8" fill="#cbd5e1" />

  <!-- AI Sparkle in top right corner -->
  <path d="M 370 140 Q 370 156 386 156 Q 370 156 370 172 Q 370 156 354 156 Q 370 156 370 140 Z" fill="#6366f1" />

  <!-- Reading Text Lines inside the Card -->
  <!-- Line 1: Normal text -->
  <rect x="136" y="196" width="240" height="16" rx="8" fill="#94a3b8" />

  <!-- Line 2: The Highlighted Word Section (밑줄 / Highlighter) -->
  <!-- Yellow Highlighter Marker behind the text -->
  <rect x="136" y="244" width="180" height="32" rx="8" fill="url(#highlightGrad)" opacity="0.9" />
  <!-- Underline Accent Bar -->
  <rect x="136" y="280" width="180" height="6" rx="3" fill="#ca8a04" />
  <!-- Text inside highlight -->
  <rect x="146" y="252" width="160" height="16" rx="8" fill="#1e293b" />
  <!-- Remaining part of line 2 -->
  <rect x="326" y="252" width="50" height="16" rx="8" fill="#cbd5e1" />

  <!-- Line 3: Normal text -->
  <rect x="136" y="316" width="210" height="16" rx="8" fill="#cbd5e1" />

  <!-- Line 4: Short text -->
  <rect x="136" y="356" width="130" height="16" rx="8" fill="#e2e8f0" />

  <!-- AI Context Floating Badge (Bottom Right) -->
  <g transform="translate(300, 310)" filter="url(#shadow)">
    <rect width="130" height="88" rx="20" fill="#4f46e5" />
    <!-- AI Text and Mini SRS Indicator -->
    <text x="65" y="44" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" text-anchor="middle">AI</text>
    <text x="65" y="70" fill="#fde047" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" text-anchor="middle">SRS • TTS</text>
  </g>
</svg>

